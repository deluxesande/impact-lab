name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# Cancels in-flight runs superseded by a newer run for the same ref — e.g.
# consecutive pushes to a PR branch. This does NOT collapse the push/
# pull_request pair: a PR run's `github.ref` is refs/pull/N/merge while the
# branch push is refs/heads/..., so they occupy different groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  ci:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # No step here pushes, so don't leave the GITHUB_TOKEN in .git/config
      # where a later step or dependency install script could read it.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Package manager is Bun: bun.lock is the only lockfile in the repo and
      # AGENTS.md mandates Bun. Pinned rather than `latest` so CI is
      # reproducible — bump this deliberately when upgrading locally.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      # Fails if bun.lock is out of sync with package.json, rather than
      # silently resolving new versions.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # No formatter step: the repo has no Prettier/Biome config and no
      # `format` script. Add one here if that changes.

      - name: Lint
        run: bun run lint

      # No `typecheck` script exists in package.json, so this invokes the
      # project's own TypeScript against its own tsconfig.json directly. It
      # fails fast on type errors before the slower build step.
      - name: Typecheck
        run: bunx tsc --noEmit

      # Unit tests via the built-in Bun test runner (no extra deps). Covers the
      # AI layer's pure logic: timeouts, produce canonicalization, cart
      # assembly, and Shamba HMAC signing.
      - name: Test
        run: bun test

      # Speeds up rebuilds; keyed on sources so it invalidates when they change.
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', '*.ts', '*.mjs') }}
          restore-keys: |
            ${{ runner.os }}-next-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-next-

      # Verified locally: the build needs no Clerk env vars, because every
      # route is dynamic and Clerk is never invoked at build time.
      - name: Build
        run: bun run build
